let activeKw = null;
let activeSrc = 'all';
let activeType = 'all';
let kwSet = ["云计算", "信息系统", "通信", "网络", "智能化", "息壤智算", "数据存储", "网络安全", "等保服务", "数字化", "交换机", "大数据", "AI", "智能"];
let srcSet = ["千里马", "客户官网"];
let typeSet = [...new Set(ALL_DATA.map(r => r.type))].filter(t => t && t !== '/');

(function init() {
  const srcSel = document.getElementById('sourceFilter');
  srcSet.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = s;
    srcSel.appendChild(opt);
  });
  const typeSel = document.getElementById('typeFilter');
  typeSet.forEach(t => {
    const opt = document.createElement('option');
    opt.value = t; opt.textContent = t;
    typeSel.appendChild(opt);
  });
  document.getElementById('statTotal').textContent = ALL_DATA.length;
  document.getElementById('statKw').textContent = kwSet.length;
  document.getElementById('statSrc').textContent = srcSet.length;
  document.getElementById('totalCount2').textContent = ALL_DATA.length;
  renderKwChips();
  renderCards();
})();

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function hl(text, q) {
  let s = esc(text);
  if (!q) return s;
  try {
    const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    return s.replace(re, '<mark>$1</mark>');
  } catch (e) { return s; }
}

function renderKwChips() {
  const box = document.getElementById('kwChips');
  box.innerHTML = '';
  const all = document.createElement('div');
  all.className = 'chip' + (activeKw === null ? ' active' : '');
  all.textContent = '全部关键词';
  all.onclick = () => { activeKw = null; renderKwChips(); renderCards(); };
  box.appendChild(all);
  kwSet.forEach(k => {
    const c = document.createElement('div');
    c.className = 'chip' + (activeKw === k ? ' active' : '');
    c.textContent = k;
    c.onclick = () => { activeKw = (activeKw === k ? null : k); renderKwChips(); renderCards(); };
    box.appendChild(c);
  });
}

document.getElementById('searchInput').addEventListener('input', renderCards);
document.getElementById('sourceFilter').addEventListener('change', e => { activeSrc = e.target.value; renderCards(); });
document.getElementById('typeFilter').addEventListener('change', e => { activeType = e.target.value; renderCards(); });
document.getElementById('sortSelect').addEventListener('change', renderCards);

function parseAmount(s) {
  const m = String(s).match(/([\d.]+)/);
  if (!m) return -1;
  let v = parseFloat(m[1]);
  if (String(s).includes('万')) v *= 10000;
  return v;
}

function renderCards() {
  const q = document.getElementById('searchInput').value.trim();
  const sort = document.getElementById('sortSelect').value;
  let list = ALL_DATA.filter(r => {
    if (activeKw && !String(r.kw).includes(activeKw)) return false;
    if (activeSrc !== 'all' && r.source !== activeSrc) return false;
    if (activeType !== 'all' && r.type !== activeType) return false;
    if (q) {
      const hay = (r.title + r.unit + r.kw + r.summary + r.source + r.type).toLowerCase();
      if (!hay.includes(q.toLowerCase())) return false;
    }
    return true;
  });
  list.sort((a, b) => {
    if (sort === 'amount_desc') {
      return parseAmount(b.amount) - parseAmount(a.amount);
    }
    const da = a.date.replace(/[^0-9]/g, ''), db = b.date.replace(/[^0-9]/g, '');
    return sort === 'date_asc' ? (da - db) : (db - da);
  });
  document.getElementById('showCount').textContent = list.length;
  const box = document.getElementById('cardContainer');
  box.innerHTML = '';
  if (list.length === 0) {
    box.innerHTML = '<div class="empty">未找到匹配的商机</div>';
    return;
  }
  let htmlStr = '';
  list.forEach(r => {
    const kws = String(r.kw).split('、').filter(k => k && k !== '/');
    const url = r.url && r.url !== '/' ? r.url : '#';
    const amountBadge = (r.amount && r.amount !== '/') ? '<span class="badge amount">' + esc(r.amount) + '</span>' : '';
    const unitBadge = (r.unit && r.unit !== '/') ? '<span class="badge unit">' + esc(r.unit) + '</span>' : '';
    htmlStr += `
      <div class="card">
        <div class="title"><a href="${esc(url)}" target="_blank">${hl(r.title, q)}</a></div>
        <div class="meta">
          <span class="badge date">${esc(r.date)}</span>
          <span class="badge src">${esc(r.source)}</span>
          ${unitBadge}
          ${amountBadge}
        </div>
        <div class="summary">${hl(r.summary, q)}</div>
        <div class="kw-tags">${kws.map(k => '<span class="kw-tag">' + esc(k) + '</span>').join('')}</div>
      </div>`;
  });
  box.innerHTML = htmlStr;
}
</script>
